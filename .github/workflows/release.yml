name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach artifacts to'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Signed release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The keystore is stored as base64 in KEYSTORE_BASE64 because Actions
      # secrets are text-only. It is written outside the workspace so it can
      # never be picked up by a packaging task or an upload glob.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. Add the release signing secrets described in README.md."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/signing/release.jks" >> "$GITHUB_ENV"

      - name: Assemble release APK and AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Optional: bakes a default gateway into the shipped build. When unset
          # the app asks for the gateway URL on first run instead.
          ORG_GRADLE_PROJECT_jarvisGatewayUrl: ${{ vars.JARVIS_GATEWAY_URL }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Verify the APK really is signed
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Rename artifacts
        id: artifacts
        run: |
          TAG="${GITHUB_REF_NAME}"
          [ -n "${{ github.event.inputs.tag }}" ] && TAG="${{ github.event.inputs.tag }}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/jarvis-${TAG}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/jarvis-${TAG}.aab"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Clean up keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-release
          path: dist/*
          if-no-files-found: error

      - name: Attach to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.artifacts.outputs.tag }}
          files: |
            dist/*.apk
            dist/*.aab
          fail_on_unmatched_files: true
